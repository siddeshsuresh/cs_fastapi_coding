- task: PowerShell@2
  displayName: 'Assume Role via OIDC and Export AWS Credentials'
  inputs:
    targetType: 'inline'
    script: |
      $tokenPath = "$env:BUILD_SOURCESDIRECTORY\oidc_token.jwt"
      Set-Content -Path $tokenPath -Value "$env:SYSTEM_ACCESSTOKEN"

      Write-Host "Calling STS AssumeRoleWithWebIdentity..."
      $stsResult = aws sts assume-role-with-web-identity `
        --role-arn "$(awsRoleArn)" `
        --role-session-name "AzureOIDCSession" `
        --web-identity-token file://$tokenPath `
        --duration-seconds 3600

      $creds = $stsResult | ConvertFrom-Json
      $env:AWS_ACCESS_KEY_ID = $creds.Credentials.AccessKeyId
      $env:AWS_SECRET_ACCESS_KEY = $creds.Credentials.SecretAccessKey
      $env:AWS_SESSION_TOKEN = $creds.Credentials.SessionToken

      Write-Host "✅ Temporary AWS credentials acquired."
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- task: PowerShell@2
  displayName: 'Generate ISO Pre-signed URL'
  inputs:
    targetType: 'inline'
    script: |
      $bucketPath = "s3://adue-nexthink-email-delivery/SM_DVD9_Win_Pro_11_24H2.iso"
      $region = "us-west-2"

      Write-Host "Running presign..."
      $presignedUrl = aws s3 presign $bucketPath --region $region

      if (-not $presignedUrl) {
        throw "Presigned URL generation failed"
      }

      Write-Host "Presigned URL: $presignedUrl"
      echo "##vso[task.setvariable variable=ISO_URL]$presignedUrl"



- task: PowerShell@2
  displayName: 'Download ISO from S3 to Local'
  inputs:
    targetType: 'inline'
    script: |
      $bucketPath = "s3://adue-nexthink-email-delivery/SM_DVD9_Win_Pro_11_24H2.iso"
      $localPath = "C:\packer\windows11.iso"

      if (-not (Test-Path "C:\packer")) {
        New-Item -ItemType Directory -Path "C:\packer" | Out-Null
      }

      Write-Host "Downloading ISO to $localPath ..."
      aws s3 cp $bucketPath $localPath --region us-west-2

      if (-not (Test-Path $localPath)) {
        throw "Download failed, ISO not found at $localPath"
      }

      Write-Host "✅ Download complete: $localPath"
      Write-Host "##vso[task.setvariable variable=LOCAL_ISO_PATH]$localPath"




- task: PowerShell@2
  displayName: 'Disable Hyper-V and Core Isolation for VirtualBox'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Disabling Hyper-V launch..."
      bcdedit /set hypervisorlaunchtype off

      Write-Host "Disabling Hypervisor Enforced Code Integrity (HVCI)..."
      $regPath = "HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity"
      if (-Not (Test-Path $regPath)) {
        New-Item -Path $regPath -Force | Out-Null
      }
      Set-ItemProperty -Path $regPath -Name "Enabled" -Value 0 -Force

      Write-Host "✅ Registry and boot config applied. Please reboot the agent manually to take full effect."

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudFormation template for ADUE Dev - VDI Automation including S3, Lambda,
  IAM, Secrets Manager, CloudFront, and API Gateway.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, int, prod]
    Description: Environment name

Resources:

  ADUEDevS3UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub adue-${Environment}-upload-bucket
      Tags:
        - Key: AppName
          Value: ADUE
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: VDI Automation Uploads

  ADUEDevLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ADUE-${Environment}-LambdaRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:aws:s3:::adue-${Environment}-upload-bucket/*
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: "*"
      Tags:
        - Key: AppName
          Value: ADUE
        - Key: Environment
          Value: !Ref Environment

  ADUEDevLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ADUE-${Environment}-WorkspaceHandler
      Runtime: python3.11
      Role: !GetAtt ADUEDevLambdaExecutionRole.Arn
      Handler: lambda_function.lambda_handler
      Code:
        S3Bucket: !Sub adue-${Environment}-upload-bucket
        S3Key: lambda/azure-s3-lambda-workspace-creation.zip
      Timeout: 30
      MemorySize: 256
      Tags:
        - Key: AppName
          Value: ADUE
        - Key: Environment
          Value: !Ref Environment

  ADUEDevSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ADUE-${Environment}-GraphAPIToken
      Description: Graph API token for Azure user validation
      Tags:
        - Key: AppName
          Value: ADUE
        - Key: Environment
          Value: !Ref Environment

  ADUEDevApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ADUE-${Environment}-VDIApi
      Description: API Gateway for CSV upload Lambda
      Tags:
        - Key: AppName
          Value: ADUE
        - Key: Environment
          Value: !Ref Environment

  ADUEDevApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ADUEDevApiGateway
      ParentId: !GetAtt ADUEDevApiGateway.RootResourceId
      PathPart: process-csv

  ADUEDevApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ADUEDevApiGateway
      ResourceId: !Ref ADUEDevApiResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: 
          Fn::Sub:
            - arn:aws:apigateway:${Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - { Region: !Ref "AWS::Region", LambdaArn: !GetAtt ADUEDevLambdaFunction.Arn }

  ADUEDevLambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ADUEDevLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ADUEDevApiGateway}/*/POST/process-csv

  ADUEDevCloudFront:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - DomainName: !Sub adue-${Environment}-upload-bucket.s3.amazonaws.com
            Id: S3Origin
            S3OriginConfig: {}
        Enabled: true
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
        DefaultRootObject: index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: AppName
          Value: ADUE
        - Key: Environment
          Value: !Ref Environment




AWSTemplateFormatVersion: '2010-09-09'
Description: Workspace CSV Uploader Stack

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, int, prod]
    Description: Deployment environment

  ApplicationName:
    Type: String
    Default: Workspace_CSV_Uploader
    Description: Logical application name used for naming and tagging

  BucketName:
    Type: String
    Description: S3 bucket for file uploads

  LambdaS3Key:
    Type: String
    Description: Lambda ZIP file S3 key

  ConfigFileKey:
    Type: String
    Description: Configuration file key (optional)

  ScheduleExpression:
    Type: String
    Description: Cron schedule for EventBridge rule

  KmsKeyId:
    Type: String
    Description: ARN of KMS key to decrypt secrets

Resources:

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ApplicationName}-${Environment}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub 'arn:aws:s3:::${BucketName}/*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: '*'
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

  AppSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ApplicationName}/${Environment}/credentials'
      Description: !Sub 'Credentials for ${ApplicationName} in ${Environment}'
      KmsKeyId: !Ref KmsKeyId
      SecretString: !Sub |
        {
          "CSV_SECRET": "example-value"
        }
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

  WorkspaceLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ApplicationName}-${Environment}-lambda'
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: nodejs18.x
      Timeout: 30
      MemorySize: 256
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref BucketName
        S3Key: !Ref LambdaS3Key
      Environment:
        Variables:
          CONFIG_FILE_KEY: !Ref ConfigFileKey
          CSV_SECRET: !Ref AppSecrets
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

  FileUploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Status: Enabled
            Id: TierToIntelligentAfter30Days
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 30
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Filter:
              S3Key:
                Rules:
                  - Name: Prefix
                    Value: uploads/
                  - Name: Suffix
                    Value: .csv
            Function: !GetAtt WorkspaceLambda.Arn
    DeletionPolicy: Retain

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WorkspaceLambda
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:aws:s3:::${BucketName}'

  FileUploadCDN:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: s3Origin
            DomainName: !Sub '${BucketName}.s3.amazonaws.com'
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: s3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
    DeletionPolicy: Retain

Outputs:
  LambdaFunctionName:
    Value: !Ref WorkspaceLambda
    Export:
      Name: !Sub '${ApplicationName}-LambdaFunctionName-${Environment}'

  LambdaFunctionArn:
    Value: !GetAtt WorkspaceLambda.Arn
    Export:
      Name: !Sub '${ApplicationName}-LambdaFunctionArn-${Environment}'

  SecretsArn:
    Value: !Ref AppSecrets
    Export:
      Name: !Sub '${ApplicationName}-Secrets-${Environment}'


  PresignedUploadHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ApplicationName}-${Environment}-http-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - https://d4px8x18daeqs.cloudfront.net
        AllowMethods:
          - GET
          - PUT
          - HEAD
        AllowHeaders:
          - content-type
        ExposeHeaders:
          - etag
        MaxAge: 0
        AllowCredentials: false
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

  PresignedUploadApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref PresignedUploadHttpApi
      StageName: dev
      AutoDeploy: true
      Description: !Sub 'Auto deployment stage for ${ApplicationName}'

  ProcessCSVIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PresignedUploadHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WorkspaceLambda.Arn}/invocations'
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'

  ProcessCSVRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PresignedUploadHttpApi
      RouteKey: 'GET /process-csv'
      Target: !Sub 'integrations/${ProcessCSVIntegration}'

  S3WorkspaceLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PresignedUploadHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WorkspaceLambda.Arn}/invocations'
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'

  S3WorkspaceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PresignedUploadHttpApi
      RouteKey: 'GET /s3-workspace-lambda'
      Target: !Sub 'integrations/${S3WorkspaceLambdaIntegration}'

  ApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WorkspaceLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PresignedUploadHttpApi}/*/*'

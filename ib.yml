---
# ===========================
# CloudFormation Template
# ===========================
AWSTemplateFormatVersion: '2010-09-09'
Description: Import Windows 11 ISO using EC2 Image Builder with Infra Config and IAM roles

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, int, prod]
    Description: Deployment environment (e.g., dev, int, prod)

  ApplicationName:
    Type: String
    Default: Win11IsoImageBuilder
    Description: Logical application name prefix

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where image builder instance will run

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet for image builder instance

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for image builder instance

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair to use for image builder

  ISOUrl:
    Type: String
    Description: S3 URL to the ISO (e.g., s3://your-bucket/windows11.iso)

  ImageName:
    Type: String
    Default: win11_byol_iso_image

Resources:

  ImageBuilderServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-${Environment}-ImageBuilderServiceRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - imagebuilder.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/EC2InstanceProfileForImageBuilder
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/EC2InstanceProfileForImageBuilderECRContainerBuilds

  ImageBuilderInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles:
        - Ref: ImageBuilderServiceRole
      InstanceProfileName: !Sub "${ApplicationName}-${Environment}-ImageBuilderInstanceProfile"

  ImageBuilderInfraConfig:
    Type: AWS::ImageBuilder::InfrastructureConfiguration
    Properties:
      Name: !Sub "${ApplicationName}-${Environment}-InfraConfig"
      Description: Infrastructure config for ISO import
      InstanceProfileName: !Ref ImageBuilderInstanceProfile
      InstanceTypes:
        - t3.large
      KeyPair: !Ref KeyPairName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroupId
      TerminateInstanceOnFailure: true
      Tags:
        Name: !Sub "${ApplicationName}-${Environment}"

Outputs:
  InfrastructureConfigName:
    Description: Name of the infrastructure configuration
    Value: !Ref ImageBuilderInfraConfig

  InfrastructureConfigArn:
    Description: ARN of the infrastructure configuration
    Value: !GetAtt ImageBuilderInfraConfig.Arn

  InstanceProfile:
    Description: Instance Profile created for EC2 Image Builder
    Value: !Ref ImageBuilderInstanceProfile

  IAMRole:
    Description: IAM Role used by Image Builder
    Value: !Ref ImageBuilderServiceRole

# ===========================
# Azure DevOps Pipeline Script
# ===========================

# Save the following as azure-pipelines.yml

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  AWS_REGION: 'us-west-2'
  IMAGE_NAME: 'win11_byol_iso_image'
  WS_IMAGE_NAME: 'Win11_23H2_July2025'
  WS_BUNDLE_NAME: 'Win11_23H2_PowerPro'
  ISO_URL: 's3://your-bucket/windows11.iso'
  ENVIRONMENT: 'dev'
  APPLICATION_NAME: 'Win11IsoImageBuilder'

steps:

- task: AWSCLI@1
  name: DeployCFStack
  inputs:
    awsCredentials: 'YourServiceConnectionName'
    regionName: '$(AWS_REGION)'
    awsCommand: 'cloudformation'
    awsSubCommand: 'deploy'
    awsArguments: '--stack-name win11-imagebuilder-stack --template-file cf-template.yaml --capabilities CAPABILITY_NAMED_IAM --parameter-overrides Environment=$(ENVIRONMENT) ApplicationName=$(APPLICATION_NAME) VpcId=<your-vpc> SubnetId=<your-subnet> SecurityGroupId=<your-sg> KeyPairName=<your-key> ISOUrl=$(ISO_URL)'
  displayName: '🚀 Deploy CloudFormation Stack for EC2 Image Builder'

- task: AWSCLI@1
  name: FetchInfraConfigArn
  inputs:
    awsCredentials: 'YourServiceConnectionName'
    regionName: '$(AWS_REGION)'
    awsCommand: 'cloudformation'
    awsSubCommand: 'describe-stacks'
    awsArguments: '--stack-name win11-imagebuilder-stack'
  displayName: '🔍 Get Infrastructure Configuration ARN'
  continueOnError: false

- script: |
    echo "🚀 Triggering Image Builder ISO import..."
    INFRA_CONFIG_ARN=$(aws cloudformation describe-stacks --stack-name win11-imagebuilder-stack \
      --query "Stacks[0].Outputs[?OutputKey=='InfrastructureConfigArn'].OutputValue" --output text)

    aws imagebuilder import-image \
      --image-name "$(IMAGE_NAME)" \
      --import-type BYOL_WINDOWS \
      --os-version "Microsoft Windows 11" \
      --iso-url "$(ISO_URL)" \
      --infrastructure-configuration-arn "$INFRA_CONFIG_ARN" \
      --role-name "$(APPLICATION_NAME)-$(ENVIRONMENT)-ImageBuilderServiceRole"
  displayName: '🛠️ Trigger EC2 ImageBuilder ISO Import'

- script: |
    echo "⏳ Waiting for AMI to become AVAILABLE..."
    while true; do
      STATUS=$(aws ec2 describe-images \
        --owners self \
        --filters "Name=name,Values=$(IMAGE_NAME)*" \
        --query 'Images | sort_by(@, &CreationDate)[-1].State' \
        --output text)

      echo "Current AMI status: $STATUS"

      if [ "$STATUS" = "available" ]; then
        echo "✅ AMI is ready!"
        break
      fi

      echo "Waiting for 30s..."
      sleep 30
    done
  displayName: '🕒 Wait for AMI to be Available'

- script: |
    echo "🔍 Getting latest AMI ID for image $(IMAGE_NAME)"
    export LATEST_AMI=$(aws ec2 describe-images \
      --owners self \
      --filters "Name=name,Values=$(IMAGE_NAME)*" \
      --query 'Images | sort_by(@, &CreationDate)[-1].ImageId' \
      --output text)

    echo "✅ Found AMI: $LATEST_AMI"

    echo "📌 Registering as WorkSpaces image..."
    aws workspaces register-workspace-image \
      --image-id "$LATEST_AMI" \
      --name "$(WS_IMAGE_NAME)" \
      --description "Imported Win11 BYOL Image from ISO" \
      --os-version "WINDOWS_11"

    echo "⏳ Waiting for WorkSpaces image registration..."
    sleep 60

    export WS_IMAGE_ID=$(aws workspaces describe-workspace-images \
      --query "Images[?Name=='$(WS_IMAGE_NAME)'].ImageId" \
      --output text)

    echo "🖼️ WorkSpaces Image ID: $WS_IMAGE_ID"

    echo "📦 Creating WorkSpaces bundle..."
    aws workspaces create-workspace-bundle \
      --bundle-name "$(WS_BUNDLE_NAME)" \
      --image-id "$WS_IMAGE_ID" \
      --compute-type-name POWERPRO \
      --user-storage Capacity=50 \
      --root-storage Capacity=80 \
      --description "Windows 11 23H2 - 8 vCPU / 32 GB RAM"
  displayName: '🚀 Register AMI and Create WorkSpaces Bundle'
  env:
    AWS_REGION: $(AWS_REGION)

- powershell: |
    Write-Host "Exporting AWS credentials manually from profile..."

    $accessKey = aws configure get aws_access_key_id
    $secretKey = aws configure get aws_secret_access_key
    $sessionToken = aws configure get aws_session_token

    if (-not $accessKey) { Write-Error "accessKey is empty"; exit 1 }
    if (-not $secretKey) { Write-Error "secretKey is empty"; exit 1 }

    # Export them into the environment
    $env:AWS_ACCESS_KEY_ID = $accessKey
    $env:AWS_SECRET_ACCESS_KEY = $secretKey
    $env:AWS_SESSION_TOKEN = $sessionToken

    Write-Host "AWS_ACCESS_KEY_ID set to: $env:AWS_ACCESS_KEY_ID"
    Write-Host "AWS_SECRET_ACCESS_KEY set."
    Write-Host "AWS_SESSION_TOKEN set."

    # Optional sanity check
    aws sts get-caller-identity
  displayName: 'Export AWS Credentials for Packer'


- powershell: |
    Write-Host "Setting AWS credentials from environment variables..."

    $accessKey = $env:AWS_ACCESS_KEY_ID
    $secretKey = $env:AWS_SECRET_ACCESS_KEY
    $sessionToken = $env:AWS_SESSION_TOKEN

    if (-not $accessKey) { Write-Error "AWS_ACCESS_KEY_ID is empty"; exit 1 }
    if (-not $secretKey) { Write-Error "AWS_SECRET_ACCESS_KEY is empty"; exit 1 }

    # Set them again to ensure downstream tools like Packer can see them
    [System.Environment]::SetEnvironmentVariable("AWS_ACCESS_KEY_ID", $accessKey, "Process")
    [System.Environment]::SetEnvironmentVariable("AWS_SECRET_ACCESS_KEY", $secretKey, "Process")
    [System.Environment]::SetEnvironmentVariable("AWS_SESSION_TOKEN", $sessionToken, "Process")

    Write-Host "✅ AWS credentials are set for the process"
    Write-Host "Access Key ID: $accessKey"
  displayName: 'Export AWS Credentials for Packer'




  - task: AWSCLI@1
  name: ExportCreds
  inputs:
    awsCredentials: '<yourServiceConnectionName>'
    regionName: 'us-west-2'
    awsCommand: 'sts'
    awsSubCommand: 'get-caller-identity'
    outputVariable: awsIdentity
  env:
    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
    AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)

- powershell: |
    Write-Host "Running Packer..."
    $env:AWS_ACCESS_KEY_ID = "$(AWS_ACCESS_KEY_ID)"
    $env:AWS_SECRET_ACCESS_KEY = "$(AWS_SECRET_ACCESS_KEY)"
    $env:AWS_SESSION_TOKEN = "$(AWS_SESSION_TOKEN)"
    
    packer build my-packer-template.json
  displayName: 'Run Packer'
